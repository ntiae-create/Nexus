name: Monorepo foundation validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up npm 11
        run: npm install --global npm@11

      - name: Install locked dependencies and prepare packages
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Run all tests
        run: npm test
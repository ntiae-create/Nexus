name: Android APK build and network policy

on:
  pull_request:
    paths:
      - ".github/workflows/android-apk.yml"
      - "apps/mobile/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-apk.yml"
      - "apps/mobile/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build debug/release APKs and verify network policy
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platform and build tools
        # `--licenses` acceptance and idempotent installs: the runner image already
        # ships some packages, and `sdkmanager --install` is safe to re-run.
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Show toolchain versions
        run: |
          java -version
          sdkmanager --version
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up npm 11
        run: npm install --global npm@11

      - name: Install locked dependencies
        run: npm ci

      - name: Verify the APK policy checker itself
        # Runs the fixtures that pin the checker's verdicts, so a later failure in
        # this job means the APK changed — not that the tool broke.
        run: npx vitest run apps/mobile/src/test-support/apk-policy-verifier.test.ts

      - name: Build web assets for the WebView
        run: npm run build --workspace @nexus/mobile

      - name: Sync Capacitor Android project
        # Generates capacitor.build.gradle / capacitor.settings.gradle targets and the
        # capacitor-cordova-android-plugins project, none of which are committed.
        run: npx cap sync android
        working-directory: apps/mobile

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: apps/mobile/android

      - name: Build release APK
        # Unsigned on purpose: this job validates compilation and the packaged
        # network policy, not distribution signing. No keystore or secret is used.
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        working-directory: apps/mobile/android

      - name: Locate built APKs
        id: apks
        run: |
          set -euo pipefail
          debug_apk="$(find apps/mobile/android/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          release_apk="$(find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' | head -1)"

          for candidate in "$debug_apk" "$release_apk"; do
            if [[ -z "$candidate" || ! -f "$candidate" ]]; then
              echo "::error::Expected APK was not produced"
              exit 1
            fi
            printf 'built: %s (%s bytes)\n' "$candidate" "$(stat -c%s "$candidate")"
          done

          # Absolute paths: the verification steps run with a different working
          # directory, so a repo-root-relative path would not resolve there.
          echo "debug_apk=$(realpath "$debug_apk")" >> "$GITHUB_OUTPUT"
          echo "release_apk=$(realpath "$release_apk")" >> "$GITHUB_OUTPUT"

      - name: Verify debug APK network policy
        id: verify_debug
        continue-on-error: true
        run: ./scripts/apk-network-policy.sh inspect "${{ steps.apks.outputs.debug_apk }}" debug
        working-directory: apps/mobile/android

      - name: Verify release APK network policy
        id: verify_release
        continue-on-error: true
        run: ./scripts/apk-network-policy.sh inspect "${{ steps.apks.outputs.release_apk }}" release
        working-directory: apps/mobile/android

      - name: Report policy verification result
        run: |
          status=0
          for variant in debug release; do
            report="apps/mobile/android/apk-policy-${variant}.txt"
            echo "========== ${variant} =========="
            if [[ -f "$report" ]]; then
              cat "$report"
            else
              echo "(no report was produced)"
            fi
            echo
          done

          {
            echo "## Android network policy verification"
            echo
            for variant in debug release; do
              report="apps/mobile/android/apk-policy-${variant}.txt"
              echo "### ${variant}"
              echo '```'
              if [[ -f "$report" ]]; then cat "$report"; else echo "(no report was produced)"; fi
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

          echo "debug outcome: ${{ steps.verify_debug.outcome }}"
          echo "release outcome: ${{ steps.verify_release.outcome }}"

          # One annotation per variant that actually failed, single line on purpose:
          # multi-line annotations are unreliable and the full dumps are already in
          # the log and the job summary above.
          for variant in debug release; do
            [ "${{ steps.verify_debug.outcome }}" = "success" ] &&               [ "${{ steps.verify_release.outcome }}" = "success" ] && break
            if [ "$variant" = "debug" ] && [ "${{ steps.verify_debug.outcome }}" = "success" ]; then continue; fi
            if [ "$variant" = "release" ] && [ "${{ steps.verify_release.outcome }}" = "success" ]; then continue; fi
            verdict="no report"
            report="apps/mobile/android/apk-policy-${variant}.txt"
            if [ -f "$report" ]; then verdict="$(head -1 "$report")"; fi
            echo "::error title=${variant} APK network policy::${verdict}"
            status=1
          done

          echo "final status: ${status}"
          exit $status

      - name: Dump compiled policy for the reviewer
        # Printed so the reviewer can see the actual packaged resource, not a claim
        # about it. `|| true` is safe here: the steps above already decided the verdict.
        run: |
          aapt2="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -name aapt2 -type f | sort -V | tail -1)"
          entry="$(unzip -Z1 "${{ steps.apks.outputs.release_apk }}" | grep -E '^res/.*\.xml$' | while read -r f; do
            if "$aapt2" dump xmltree --file "$f" "${{ steps.apks.outputs.release_apk }}" | grep -q 'E: network-security-config'; then echo "$f"; break; fi
          done)"

          echo "===== RELEASE manifest ====="
          "$aapt2" dump xmltree --file AndroidManifest.xml "${{ steps.apks.outputs.release_apk }}" | grep -iE "networkSecurityConfig|usesCleartextTraffic|debuggable" || true

          echo "===== RELEASE ${entry} ====="
          "$aapt2" dump xmltree --file "$entry" "${{ steps.apks.outputs.release_apk }}" || true
        working-directory: apps/mobile/android

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: nexus-apks
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/*.apk
            apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

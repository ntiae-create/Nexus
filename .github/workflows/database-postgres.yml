name: PostgreSQL database validation

on:
  pull_request:
    paths:
      - ".github/workflows/database-postgres.yml"
      - "packages/database/**"
      - "package.json"
      - "package-lock.json"
  push:
    paths:
      - ".github/workflows/database-postgres.yml"
      - "packages/database/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integration:
    name: PostgreSQL 17 integration tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: nexus_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # =========================================================================================
      # PROVISIONAMENTO DO PAPEL DE MIGRACAO — espelha `docs/r38/scripts/install_clean.sh`.
      # =========================================================================================
      # Sem este passo o runner falha em `GRANT nexus_app TO nexus_migrator`, porque o papel nao
      # existe: `bootstrap.sql` cria apenas `nexus_app` e `nexus_anonymous`.
      #
      # A separacao de privilegios e a mesma da producao:
      #   * `postgres`         — superusuario do cluster de teste; so CRIA o papel e o banco.
      #                          Nenhuma migration, verificador ou dado passa por ele.
      #   * `nexus_migrator`   — NOSUPERUSER, NOBYPASSRLS, NOCREATEDB, NOINHERIT. Dono do banco e
      #                          do schema; aplica as migrations e executa o verificador de
      #                          exclusao. E o papel de operacao real.
      #   * `nexus_app`        — criado pelo `bootstrap.sql` com apenas os privilegios da aplicacao.
      #
      # O dono do banco TEM de ser `nexus_migrator`: com o banco pertencendo a `postgres`, a
      # primeira migration falha com `permission denied for database nexus_test`, porque um papel
      # nao-superusuario so cria o schema `nexus` se for dono do banco (verificado em PG 17.11).
      - name: Provision the migration role (mirrors install_clean.sh)
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
        run: |
          set -eu
          psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          -- O cluster de teste nasce com o banco `nexus_test` pertencendo a `postgres`
          -- (POSTGRES_DB/POSTGRES_USER do servico). Recriamos com o dono correto.
          DROP DATABASE IF EXISTS nexus_test;
          DROP ROLE IF EXISTS nexus_migrator;
          CREATE ROLE nexus_migrator LOGIN CREATEROLE NOSUPERUSER NOBYPASSRLS NOCREATEDB NOINHERIT;
          CREATE DATABASE nexus_test OWNER nexus_migrator;
          SQL
          psql -X -v ON_ERROR_STOP=1 -d nexus_test -c "ALTER SCHEMA public OWNER TO nexus_migrator;"

          # ---------------------------------------------------------------------------------------
          # Pre-requisitos da migration 00007, identicos ao provisionamento de producao
          # (`install_clean.sh:263` e `:283`). Ambos sao executados PELO PROPRIO `nexus_migrator`,
          # nunca por `postgres` — e nenhum concede SUPERUSER ou BYPASSRLS.
          #
          # 1. `nexus_audit_writer` — a 00007 transfere a propriedade da funcao de auditoria para
          #    esse papel. `ALTER FUNCTION ... OWNER TO` exige que o executante possa
          #    `SET ROLE` ao novo dono. Criar o papel NAO concede isso automaticamente: a
          #    membresia implicita do `CREATE ROLE` tem `set_option = false` e grantor diferente
          #    (documentado em `00007`, secao "PROVISIONAMENTO EM INSTALACAO REAL SEM SUPERUSER").
          # 2. `CREATE` no schema `nexus` para o novo dono — sem isso a transferencia falha com a
          #    mensagem enganosa `permission denied for schema nexus`. Este GRANT depende da
          #    existencia do schema, portanto e emitido pelo runner imediatamente antes da 00007,
          #    no mesmo ponto em que `install_clean.sh:283` o emite em producao.
          # ---------------------------------------------------------------------------------------
          psql -X -v ON_ERROR_STOP=1 -d nexus_test -U nexus_migrator <<'SQL'
          CREATE ROLE nexus_audit_writer NOLOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          GRANT nexus_audit_writer TO nexus_migrator WITH SET TRUE;
          SQL

          # ---------------------------------------------------------------------------------------
          # `nexus_audit_writer` — os CINCO atributos, um por assercao.
          # ---------------------------------------------------------------------------------------
          # O escritor de auditoria grava na trilha append-only por funcao SECURITY DEFINER, sob
          # FORCE ROW LEVEL SECURITY. Se ele pudesse logar, ter SUPERUSER, BYPASSRLS, CREATE DATABASE
          # ou CREATEROLE, as provas de isolamento da Fase 5 passariam a exercitar um caminho que
          # nao existe em producao — e a auditoria deixaria de ser confiavel.
          #
          # Uma unica consulta le os cinco atributos de `pg_roles` — o estado REAL do cluster, nao
          # o texto do `CREATE ROLE` — e devolve `atributo=valor` por linha, ordenado.
          #
          # `::text` de um booleano produz `true`/`false`, NAO `t`/`f`: comparar com `f` falharia
          # sempre (foi o primeiro erro desta mudanca). `::int` da 0/1 sem ambiguidade.
          audit_writer_attrs=$(psql -X -Atd postgres -c "
            SELECT 'rolcanlogin='   || rolcanlogin::int   FROM pg_roles WHERE rolname = 'nexus_audit_writer'
            UNION ALL
            SELECT 'rolsuper='      || rolsuper::int      FROM pg_roles WHERE rolname = 'nexus_audit_writer'
            UNION ALL
            SELECT 'rolbypassrls='  || rolbypassrls::int  FROM pg_roles WHERE rolname = 'nexus_audit_writer'
            UNION ALL
            SELECT 'rolcreatedb='   || rolcreatedb::int   FROM pg_roles WHERE rolname = 'nexus_audit_writer'
            UNION ALL
            SELECT 'rolcreaterole=' || rolcreaterole::int FROM pg_roles WHERE rolname = 'nexus_audit_writer'
            ORDER BY 1")
          if [ -z "$audit_writer_attrs" ]; then
            echo "nexus_audit_writer does not exist; the audit trail writer was not provisioned." >&2
            exit 1
          fi
          # Assercoes SEPARADAS, cada uma com a sua mensagem: um `OR` agrupado esconderia qual
          # atributo regrediu. `grep -qx` exige a linha inteira, para `rolsuper=0` nao casar por
          # prefixo com outra chave.
          printf '%s\n' "$audit_writer_attrs" | grep -qx 'rolcanlogin=0'   || { echo "nexus_audit_writer must be NOLOGIN (rolcanlogin = true)" >&2; exit 1; }
          printf '%s\n' "$audit_writer_attrs" | grep -qx 'rolsuper=0'      || { echo "nexus_audit_writer must be NOSUPERUSER (rolsuper = true)" >&2; exit 1; }
          printf '%s\n' "$audit_writer_attrs" | grep -qx 'rolbypassrls=0'  || { echo "nexus_audit_writer must be NOBYPASSRLS (rolbypassrls = true)" >&2; exit 1; }
          printf '%s\n' "$audit_writer_attrs" | grep -qx 'rolcreatedb=0'   || { echo "nexus_audit_writer must be NOCREATEDB (rolcreatedb = true)" >&2; exit 1; }
          printf '%s\n' "$audit_writer_attrs" | grep -qx 'rolcreaterole=0' || { echo "nexus_audit_writer must be NOCREATEROLE (rolcreaterole = true)" >&2; exit 1; }
          echo "nexus_audit_writer: NOLOGIN, NOSUPERUSER, NOBYPASSRLS, NOCREATEDB, NOCREATEROLE — verificado"

          # Prova negativa: os atributos amplos NAO existem. Sem esta checagem, uma alteracao
          # futura no provisionamento poderia conceder SUPERUSER/BYPASSRLS sem ninguem notar, e
          # todos os verificadores de RLS passariam a testar menos do que afirmam.
          test "$(psql -X -Atd postgres -c "SELECT rolsuper FROM pg_roles WHERE rolname='nexus_migrator'")" = "f"
          test "$(psql -X -Atd postgres -c "SELECT rolbypassrls FROM pg_roles WHERE rolname='nexus_migrator'")" = "f"
          test "$(psql -X -Atd postgres -c "SELECT rolcreatedb FROM pg_roles WHERE rolname='nexus_migrator'")" = "f"
          echo "nexus_migrator: NOSUPERUSER, NOBYPASSRLS, NOCREATEDB — verificado"

      - name: Install locked workspace dependencies
        run: npm ci

      - name: Run static database tests
        run: npm test --workspace @nexus/database

      - name: Apply migrations and run PostgreSQL integration tests
        env:
          NEXUS_TEST_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: npm run test:integration --workspace @nexus/database

      - name: Test repositories against isolated PostgreSQL
        env:
          NEXUS_DATABASE_URL: postgres://nexus_app@127.0.0.1:5432/nexus_test
        run: >-
          npx vitest run --no-file-parallelism
          packages/database/src/postgres/pool.integration.test.ts
          packages/database/src/postgres/repositories.integration.test.ts

      - name: Test NEXUS CORE execution against isolated PostgreSQL
        env:
          NEXUS_DATABASE_URL: postgres://nexus_app@127.0.0.1:5432/nexus_test
        run: npx vitest run apps/server/src/core/engine.postgres.integration.test.ts

      - name: Test cross-instance cancellation against isolated PostgreSQL
        env:
          NEXUS_DATABASE_URL: postgres://nexus_app@127.0.0.1:5432/nexus_test
        run: npx vitest run apps/server/src/core/cancellation.postgres.integration.test.ts

      - name: Test auth store against isolated PostgreSQL
        env:
          NEXUS_TEST_AUTH_DATABASE_URL: postgres://postgres@127.0.0.1:5432/nexus_test
        run: npx vitest run apps/server/src/auth/postgres-store.integration.test.ts

      - name: Stop temporary PostgreSQL service
        if: always()
        env:
          NEXUS_TEST_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          if [ -n "$NEXUS_TEST_POSTGRES_CONTAINER_ID" ] && docker inspect "$NEXUS_TEST_POSTGRES_CONTAINER_ID" >/dev/null 2>&1; then
            docker stop "$NEXUS_TEST_POSTGRES_CONTAINER_ID" >/dev/null
          fi

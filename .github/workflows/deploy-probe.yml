name: Deploy probe (temporary)

on:
  push:
    paths:
      - '.github/workflows/deploy-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the deployed API
        env:
          BASE: https://nexus-server-five.vercel.app
        run: |
          set -eu
          probe() {
            name=$1; shift
            body=$(mktemp)
            code=$(curl -sS --max-time 30 -o "$body" -w '%{http_code}' "$@" || echo "000")
            printf '%-30s HTTP %s  %s\n' "$name" "$code" "$(head -c 200 "$body")"
            rm -f "$body"
          }
          probe "/v1/health" "$BASE/v1/health?p=$GITHUB_RUN_ID"
          probe "/v1/ready" "$BASE/v1/ready?p=$GITHUB_RUN_ID"
          probe "/v1/assistants" "$BASE/v1/assistants?p=$GITHUB_RUN_ID"
          probe "login (senha errada)" -X POST -H 'content-type: application/json' \
            --data '{"password":"definitely-not-the-owner-password"}' "$BASE/v1/auth/login"
          probe "/v1/deploy-probe" "$BASE/v1/deploy-probe?p=$GITHUB_RUN_ID"

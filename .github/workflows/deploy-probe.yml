name: Deploy probe (temporary)

# TEMPORARY. Deleted in the commit that follows this run.
# Writes the probe output back to the branch because the runner's log endpoint
# is not reachable from the agent's sandbox.

on:
  push:
    paths:
      - '.github/workflows/deploy-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/3bd1baf9-nexus
      - name: Probe the deployed API
        env:
          BASE: https://nexus-server-five.vercel.app
        run: |
          set -eu
          out=/tmp/probe.txt
          : > "$out"
          probe() {
            name=$1; shift
            body=$(mktemp)
            code=$(curl -sS --max-time 30 -o "$body" -w '%{http_code}' "$@" || echo "000")
            printf '%-28s HTTP %s  %s\n' "$name" "$code" "$(head -c 220 "$body")" | tee -a "$out"
            rm -f "$body"
          }
          probe "/v1/health" "$BASE/v1/health?p=$GITHUB_RUN_ID"
          probe "/v1/ready" "$BASE/v1/ready?p=$GITHUB_RUN_ID"
          probe "/v1/assistants" "$BASE/v1/assistants?p=$GITHUB_RUN_ID"
          probe "login senha errada" -X POST -H 'content-type: application/json' \
            --data '{"password":"definitely-not-the-owner-password"}' "$BASE/v1/auth/login"
          probe "/v1/deploy-probe" "$BASE/v1/deploy-probe?p=$GITHUB_RUN_ID"
          cp "$out" deploy-probe-result.txt
      - name: Publish result
        run: |
          git config user.name "nexus-probe"
          git config user.email "probe@users.noreply.github.com"
          git add deploy-probe-result.txt
          git commit -m "chore(ci): resultado do probe [skip ci]"
          git push origin HEAD:arena/3bd1baf9-nexus
